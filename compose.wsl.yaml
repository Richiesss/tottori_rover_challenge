# WSL2 (WSLg) 用の追加設定
services:
  ros:
    environment:
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - XDG_RUNTIME_DIR=/mnt/wslg/runtime-dir
      - PULSE_SERVER=/mnt/wslg/PulseServer
      # WSLのGPU (D3D12) ドライバを使う
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      # 指定しないとソフトウェアレンダリング (llvmpipe) になり、Gazeboが重くなる
      - GALLIUM_DRIVER=${GALLIUM_DRIVER:-d3d12}
    volumes:
      # WSLでは /tmp/.X11-unix が空になることがあるため、WSLg本体のソケットを直接使う
      - /mnt/wslg/.X11-unix:/tmp/.X11-unix:rw
      - /mnt/wslg:/mnt/wslg
      - /usr/lib/wsl:/usr/lib/wsl:ro
    devices:
      - /dev/dxg:/dev/dxg
